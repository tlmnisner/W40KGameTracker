<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#7d7d7d;--panel:#fff;--ink:#0d0d0d;--mute:#4d4d4d;--line:#0d0d0d;--bw:2px;--sh:5px 5px 0 #222;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 "EB Garamond",Georgia,serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,button,th,label,.game b,.vs{font-family:"Cinzel",Georgia,serif}
h1,h2,h3{font-weight:900;margin:0;letter-spacing:.04em;text-transform:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:var(--bw) solid var(--line);background:#fff;border-radius:0;padding:8px 16px;font-weight:700;font-size:14px;letter-spacing:.06em;transition:background .1s,color .1s}
button:hover{background:var(--ink);color:#fff}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:#fff;color:var(--ink)}
button.link{border:0;background:none;padding:2px 8px;text-decoration:underline}
button.link:hover{background:var(--ink);color:#fff}
:focus-visible{outline:3px double #fff;outline-offset:3px;box-shadow:0 0 0 2px #000}
input,textarea{width:100%;padding:10px 12px;border:var(--bw) solid var(--line);border-radius:0;background:#fff}
input:focus,textarea:focus{outline:0;box-shadow:inset 0 0 0 2px #000}
label{display:block;font-weight:700;font-size:13px;letter-spacing:.06em;margin:14px 0 6px}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:var(--panel);border-right:3px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:22px 20px;background:var(--ink);color:#fff;border-bottom:3px solid var(--line)}
.side-head h1{font-size:28px;letter-spacing:.08em}
.api{display:flex;gap:8px;margin-top:14px}
.api input{font-size:15px;padding:7px 10px;border-color:#fff}
.api button{padding:6px 12px;border-color:#fff}
#list{overflow:auto;flex:1;padding:14px;background:#d9d9d9}
.game{display:block;width:100%;text-align:left;border:var(--bw) solid var(--line);padding:12px 14px;margin-bottom:12px;background:#fff;font-weight:400;letter-spacing:0;font-size:inherit}
.game:hover{background:#efefef;color:var(--ink)}
.game.on{background:var(--ink);color:#fff;box-shadow:var(--sh)}
.game b{display:block;font-weight:700;letter-spacing:.04em;font-size:15px}
.game small{font-size:16px;opacity:.8}
.side-foot{padding:16px;border-top:3px solid var(--line)}
.side-foot button{box-shadow:var(--sh)}
main{overflow:auto;padding:32px clamp(16px,4vw,56px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0))}
.empty{max-width:44ch;margin-top:10vh;background:#fff;border:3px solid var(--line);box-shadow:8px 8px 0 #222;padding:28px}
.empty h2{font-size:30px;margin-bottom:8px}
.empty p{margin:0}
.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.head>div:first-child{background:#fff;border:3px solid var(--line);box-shadow:8px 8px 0 #222;padding:18px 24px;flex:1 1 320px}
.head h2{font-size:40px;line-height:1.1}
.head p{margin:8px 0 0;max-width:60ch;color:var(--mute)}
.head>div:last-child{display:flex;gap:10px}
.vs{display:flex;align-items:center;gap:14px;margin:28px 0 12px;font-weight:900;font-size:22px;flex-wrap:wrap}
.vs .a,.vs .b{border:var(--bw) solid var(--line);padding:6px 18px;box-shadow:var(--sh);letter-spacing:.06em}
.vs .a{background:#fff;color:var(--ink)}.vs .b{background:var(--ink);color:#fff}
.vs i{font-style:normal;font-size:15px;font-weight:700;color:#fff}
.meta{color:#fff;font-size:16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:36px 0 14px}
.sec h3{font-size:26px;color:#fff}
.sec button{box-shadow:var(--sh)}
.tbl{overflow-x:auto;background:#fff;border:3px solid var(--line);box-shadow:8px 8px 0 #222}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:12px 16px;border-bottom:var(--bw) solid var(--line);white-space:nowrap}
th{background:var(--ink);color:#fff;font-weight:700;letter-spacing:.06em;font-size:13px}
tr:last-child td{border-bottom:0}
td.act{text-align:right}
dialog{border:3px solid var(--line);border-radius:0;background:#fff;color:var(--ink);padding:24px;width:min(480px,92vw);box-shadow:8px 8px 0 #222}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{font-size:26px;margin-bottom:4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:160px}
.hint{font-size:15px;color:var(--mute);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px #000,var(--sh);padding:10px 18px;max-width:90vw;display:none;z-index:9;font-family:"Cinzel",serif;font-weight:700;letter-spacing:.04em}
#toast.err{background:#fff;color:var(--ink);border-color:#000}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:3px solid var(--line);max-height:44vh}.head h2{font-size:30px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="side-head">
      <h1>Game Tracker</h1>
      <div class="api"><input id="base" aria-label="API address" value="http://127.0.0.1:8000"><button id="reload">Load</button></div>
    </div>
    <div id="list"></div>
    <div class="side-foot"><button class="primary" id="newGame" style="width:100%">New game</button></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="gameDlg"><form method="dialog" id="gameForm">
  <h3 id="gameTitle">New game</h3>
  <label for="g_title">Title</label><input id="g_title" required>
  <label for="g_desc">Description</label><input id="g_desc">
  <label for="g_p1">Player one</label><input id="g_p1" required>
  <label for="g_p2">Player two</label><input id="g_p2" required>
  <div class="row"><button type="button" data-close>Cancel</button><button class="primary" id="gameSave">Save game</button></div>
</form></dialog>

<dialog id="roundDlg"><form method="dialog" id="roundForm">
  <h3 id="roundTitle">Add round</h3>
  <label for="r_json">Round data (JSON)</label>
  <textarea id="r_json" spellcheck="false">{}</textarea>
  <p class="hint">Sent as the request body. Use the field names from your Round schema.</p>
  <div class="row"><button type="button" data-close>Cancel</button><button class="primary">Save round</button></div>
</form></dialog>

<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const state={games:[],sel:null,editGame:null,editRound:null};
const base=()=>{try{localStorage.setItem('gt_base',$('#base').value)}catch(e){};return $('#base').value.replace(/\/+$/,'')};
try{const b=localStorage.getItem('gt_base');if(b)$('#base').value=b}catch(e){}

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function api(method,path,body){
  let r;
  try{r=await fetch(base()+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error("Can't reach the API at "+base()+". Check that the server is running and allows CORS from this page.")}
  if(r.status===204)return null;
  const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!r.ok){
    const d=data&&data.detail;
    const msg=Array.isArray(d)?d.map(x=>(x.loc||[]).join('.')+': '+x.msg).join('; '):(d||r.statusText);
    throw new Error(`${r.status} ${msg}`)
  }
  return data
}
const guard=fn=>async(...a)=>{try{await fn(...a)}catch(e){toast(e.message,true)}};

const loadGames=guard(async()=>{state.games=await api('GET','/games/');renderList();if(state.sel)await openGame(state.sel,true)});
const openGame=guard(async(id,quiet)=>{
  try{const g=await api('GET','/games/'+id);state.sel=id;const i=state.games.findIndex(x=>x.id===id);if(i>=0)state.games[i]=g;renderList();renderGame(g)}
  catch(e){if(quiet){state.sel=null;renderMain()}throw e}
});

function renderList(){
  const el=$('#list');
  if(!state.games.length){el.innerHTML='<p class="meta" style="padding:8px 12px">No games yet.</p>';return}
  el.innerHTML=state.games.map(g=>`<button class="game ${g.id===state.sel?'on':''}" data-id="${esc(g.id)}"><b>${esc(g.title)}</b><small>${esc(g.player_one_name)} vs ${esc(g.player_two_name)} &middot; ${(g.rounds||[]).length} rounds</small></button>`).join('');
}
function renderMain(){
  $('#main').innerHTML=`<div class="empty"><h2>${state.games.length?'Pick a game':'Start your first game'}</h2><p>${state.games.length?'Choose a game on the left to see its rounds.':'Create a game with two players, then add rounds as you play.'}</p></div>`;
}
const roundKey=(r,i)=>r.round??r.round_number??r.number??r.id??(i+1);
function renderGame(g){
  const rounds=g.rounds||[];
  const cols=[...new Set(rounds.flatMap(r=>Object.keys(r)))];
  const fmt=v=>typeof v==='object'&&v!==null?JSON.stringify(v):v;
  $('#main').innerHTML=`
  <div class="head"><div><h2>${esc(g.title)}</h2>${g.game_description?`<p>${esc(g.game_description)}</p>`:''}</div>
    <div><button id="editGame">Edit game</button> <button class="danger" id="delGame">Delete</button></div></div>
  <div class="vs"><span class="a">${esc(g.player_one_name)}</span><i>vs</i><span class="b">${esc(g.player_two_name)}</span></div>
  <div class="meta">Created ${g.created_at?new Date(g.created_at).toLocaleString():''}</div>
  <div class="sec"><h3>Rounds</h3><button class="primary" id="addRound">Add round</button></div>
  ${rounds.length?`<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rounds.map((r,i)=>`<tr>${cols.map(c=>`<td>${esc(fmt(r[c]))}</td>`).join('')}<td class="act"><button class="link" data-edit="${i}">Edit</button><button class="link" data-del="${i}">Delete</button></td></tr>`).join('')}
  </tbody></table></div>`:'<p class="meta">No rounds yet. Add the first one to start scoring.</p>'}`;
}

/* game dialog */
function openGameDlg(g){
  state.editGame=g||null;
  $('#gameTitle').textContent=g?'Edit game':'New game';
  $('#g_title').value=g?.title||'';$('#g_desc').value=g?.game_description||'';
  $('#g_p1').value=g?.player_one_name||'';$('#g_p2').value=g?.player_two_name||'';
  $('#gameDlg').showModal();
}
$('#gameForm').addEventListener('submit',guard(async e=>{
  const body={title:$('#g_title').value.trim(),game_description:$('#g_desc').value.trim(),player_one_name:$('#g_p1').value.trim(),player_two_name:$('#g_p2').value.trim()};
  if(state.editGame){await api('PATCH','/games/'+state.editGame.id,body);toast('Game saved')}
  else{const g=await api('POST','/games/',body);state.sel=g.id;toast('Game created')}
  await loadGames();
}));

/* round dialog */
function openRoundDlg(i){
  const g=state.games.find(x=>x.id===state.sel);
  state.editRound=i==null?null:i;
  $('#roundTitle').textContent=i==null?'Add round':'Edit round';
  let seed={};
  if(i!=null){seed={...g.rounds[i]};['id','game_id','created_at'].forEach(k=>delete seed[k])}
  else if(g.rounds&&g.rounds.length){const l={...g.rounds[g.rounds.length-1]};['id','game_id','created_at','round','round_number','number'].forEach(k=>delete l[k]);seed=l}
  $('#r_json').value=JSON.stringify(seed,null,2);
  $('#roundDlg').showModal();
}
$('#roundForm').addEventListener('submit',e=>{
  let body;
  try{body=JSON.parse($('#r_json').value)}catch(x){e.preventDefault();toast('Round data is not valid JSON',true);return}
  guard(async()=>{
    const g=state.games.find(x=>x.id===state.sel);
    if(state.editRound==null){await api('POST',`/rounds/${g.id}/`,body);toast('Round added')}
    else{const key=roundKey(g.rounds[state.editRound],state.editRound);await api('PATCH',`/rounds/${g.id}/${key}`,body);toast('Round saved')}
    await openGame(g.id);
  })();
});

/* events */
$('#list').addEventListener('click',e=>{const b=e.target.closest('.game');if(b)openGame(b.dataset.id)});
$('#main').addEventListener('click',guard(async e=>{
  const g=state.games.find(x=>x.id===state.sel);if(!g)return;
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='editGame')openGameDlg(g);
  else if(t.id==='addRound')openRoundDlg();
  else if(t.id==='delGame'){if(confirm(`Delete "${g.title}" and all its rounds?`)){await api('DELETE','/games/'+g.id);state.sel=null;toast('Game deleted');await loadGames();renderMain()}}
  else if(t.dataset.edit!=null)openRoundDlg(+t.dataset.edit);
  else if(t.dataset.del!=null){const i=+t.dataset.del;if(confirm('Delete this round?')){await api('DELETE',`/rounds/${g.id}/${roundKey(g.rounds[i],i)}`);toast('Round deleted');await openGame(g.id)}}
}));
$('#newGame').onclick=()=>openGameDlg();
$('#reload').onclick=loadGames;
$('#base').addEventListener('keydown',e=>{if(e.key==='Enter')loadGames()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

renderMain();loadGames();
</script>
</body>
</html>
